<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="canonical" href="index.html">
        <meta name="theme-color" content="#000000">
        <meta name="robots" content="index, follow">
        <link rel="amphtml" href="amp/index.html">
        <meta name="description" content="Riobet">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Riobet">
        <meta property="og:image" content="img/screen-1.webp">
        <title>Document</title>
        <link rel="preload" as="font" type="font/woff2" href="fonts/rc-cyrillic.woff2" crossorigin>
        <link rel="preload" as="image" href="img/banner-live.webp" fetchpriority="high">
        <link rel="stylesheet" href="./style/style.css">
        <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='15'%20fill='%231d7a3c'%20stroke='%23edc97f'%20stroke-width='2'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Arial'%20font-size='16'%20font-weight='700'%20fill='%23edc97f'%20text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
    </head>
    <body>
    <header class="container_header">
        <div class="container wrapper_content">
            <a class="logo" href="#top" aria-label="Riobet — на главную">
                <img src="img/logo.svg" width="175" height="56" alt="Риобет" fetchpriority="high"/>
            </a>
            <div class="buttons">
                <button class="btn btn_login" type="button" data-modal="login-modal">Вход</button>
                <button class="btn btn_gold" type="button" data-modal="signup-modal">Регистрация</button>
            </div>
        </div>
    </header>
    <nav class="container_nav" aria-label="Разделы казино">
        <ul class="container container_nav_list">
            <li>
                <a class="container_nav_item" href="https://riobet.com/pt-br/">
                    <span class="container_nav_ico" aria-hidden="true">
                        <img src="img/icons/nav-official.svg" width="28" height="28" alt="">
                    </span>
                    Официальный сайт
                </a>
            </li>
            <li>
                <a class="container_nav_item" href="#review">
                    <span class="container_nav_ico" aria-hidden="true">
                        <img src="img/icons/nav-money.svg" width="28" height="28" alt="">
                    </span>
                    Игра на деньги
                </a>
            </li>
            <li>
                <a class="container_nav_item" href="#bonuses-promo">
                    <span class="container_nav_ico" aria-hidden="true">
                        <img src="img/icons/nav-bonus.svg" width="28" height="28" alt="">
                    </span>
                    Бонусы
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <section class="container_offer" id="top" aria-label="Приветственный бонус">
            <div class="container">
                <div class="container_offer_box">
                    <p class="container_offer_kicker">Приветственный бонус</p>
                    <p class="container_offer_text">100% на первый депозит и 150 фриспинов</p>
                    <div class="container_offer_row">
                        <p class="container_offer_code">
                            <span class="container_offer_code_label">Промокод:</span>
                            <span class="container_offer_code_value">RIO100</span>
                        </p>
                        <button class="btn btn_gold" type="button" data-modal="bonus-modal">Забрать бонус</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="container_slider" aria-label="Акции казино">
            <div class="container">
                <div class="content_panel" data-slider>
                    <div class="wrapper_slider">
                        <div class="wrapper_slider_viewport">
                            <ul class="wrapper_slider_track">
                                <li class="item_slide" aria-roledescription="slide" aria-label="1 из 3">
                                    <img class="item_slide_img" src="img/banner-live.webp" width="1440" height="360" alt="Играй в прямом эфире" fetchpriority="high" decoding="async" srcset="img/banner-live-960.webp 960w, img/banner-live.webp 1440w" sizes="100vw">
                                    <span class="item_slide_cta">
                                        <button class="btn btn_green" type="button" data-modal="play-modal">Играть</button>
                                    </span>
                                </li>
                                <li class="item_slide" aria-roledescription="slide" aria-label="2 из 3">
                                    <img class="item_slide_img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-src="img/banner-welcome.webp" width="1440" height="360" alt="Приветственный пакет Riobet: 100% к депозиту и 150 фриспинов" decoding="async" data-srcset="img/banner-welcome-960.webp 960w, img/banner-welcome.webp 1440w" sizes="100vw">
                                    <span class="item_slide_cta">
                                        <button class="btn btn_green" type="button" data-modal="play-modal">Играть</button>
                                    </span>
                                </li>
                                <li class="item_slide" aria-roledescription="slide" aria-label="3 из 3">
                                    <img class="item_slide_img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-src="img/banner-drops.webp" width="1440" height="360" alt="Турнир Drops &amp; Wins с призовым фондом в Riobet" decoding="async" data-srcset="img/banner-drops-960.webp 960w, img/banner-drops.webp 1440w" sizes="100vw">
                                    <span class="item_slide_cta">
                                        <button class="btn btn_green" type="button" data-modal="play-modal">Играть</button>
                                    </span>
                                </li>
                            </ul>
                        </div>
                        <button class="wrapper_slider_arrow wrapper_slider_arrow_prev"  aria-label="Предыдущий слайд">&#8249;</button>
                        <button class="wrapper_slider_arrow wrapper_slider_arrow_next" type="button" aria-label="Следующий слайд">&#8250;</button>
                    </div>
                </div>
            </div>
        </section>

    </main>
    <script src="./script/script.js" defer></script>
    </body>
</html>
